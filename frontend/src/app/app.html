<div class="container">
  <h1>Willkommen zu Ihrer App!</h1>
  <p>Angular-Frontend & Spring Boot Backend (Maven-Multi-Modul)</p>

  @if( backendData)
  {
    <div>
      <div class="status-card status-success">
        <span>🟢</span> Connection successful!
      </div>

      <app-data-card [message]="backendData.message"></app-data-card>
    </div>
  }
  @else if( errorMessage)
  {
    <div class="status-card status-error">
      <span>🔴</span> {{ errorMessage }}
    </div>
  }
  @else
  {
    <div class="status-card status-loading">
      <span>⏳</span> Loading data from backend...
    </div>
  }
</div>
